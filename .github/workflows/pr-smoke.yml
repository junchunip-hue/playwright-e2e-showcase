name: PR Smoke Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

env:
  # Toolshop is booted inside the runner instead of using the public demo:
  # the demo sits behind Cloudflare, which serves a bot challenge to CI runner IPs.
  # Pinned to an upstream commit so the system under test only changes when we bump it.
  TOOLSHOP_REF: ae7caecb811dd8952c09d997e69be7cb946ecd44
  SPRINT: sprint5
  DISABLE_LOGGING: 'true'
  BASE_URL: http://localhost:4200
  API_URL: http://localhost:8091

# Two independent jobs, one per language, each against its own Toolshop instance.
# The Toolshop boot is shared through the composite actions in .github/actions/.
jobs:
  smoke:
    name: smoke (TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # Start the build early: images build and the Angular dev server compiles
      # in the background while we install our own dependencies.
      - uses: ./.github/actions/toolshop-start
        with:
          ref: ${{ env.TOOLSHOP_REF }}
          sprint: ${{ env.SPRINT }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint & typecheck
        run: |
          npm run lint
          npm run typecheck

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - uses: ./.github/actions/toolshop-ready
        with:
          api-url: ${{ env.API_URL }}
          base-url: ${{ env.BASE_URL }}

      - name: Run smoke tests (API + Chromium)
        run: npx playwright test --project=api --project=chromium --grep "@smoke|@setup"

      - name: Dump Toolshop logs on failure
        if: ${{ failure() }}
        working-directory: toolshop
        run: docker compose logs --tail=200

      - name: Upload HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  smoke-java:
    name: smoke (Java)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/toolshop-start
        with:
          ref: ${{ env.TOOLSHOP_REF }}
          sprint: ${{ env.SPRINT }}

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: java/pom.xml

      - name: Compile tests
        working-directory: java
        run: ./mvnw -B -q test-compile

      - name: Install Chromium
        working-directory: java
        run: ./mvnw -B -q exec:java -Dexec.args="install --with-deps chromium"

      - uses: ./.github/actions/toolshop-ready
        with:
          api-url: ${{ env.API_URL }}
          base-url: ${{ env.BASE_URL }}

      - name: Run smoke tests (JUnit 5)
        working-directory: java
        run: ./mvnw -B test -Dgroups=smoke

      - name: Dump Toolshop logs on failure
        if: ${{ failure() }}
        working-directory: toolshop
        run: docker compose logs --tail=200

      - name: Upload JUnit reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: junit-reports
          path: java/target/surefire-reports/
          retention-days: 14
