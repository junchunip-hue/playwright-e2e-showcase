name: PR Smoke Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

# Toolshop is booted inside the runner instead of using the public demo: the demo sits behind Cloudflare,
# which serves a bot challenge to CI runner IPs. The pinned version and URLs live in
# .github/actions/toolshop-start, shared by every workflow.
# Two independent jobs, one per language, each against its own Toolshop instance.
jobs:
  smoke:
    name: smoke (TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # Start the build early: images build and the Angular dev server compiles
      # in the background while we install our own dependencies.
      - uses: ./.github/actions/toolshop-start

      - uses: ./.github/actions/setup-node-suite

      # check:tags fails on unknown tags or tests without a tier (smoke/regression/setup/seed).
      # test:architecture fails on pipeline loops: self-triggering workflows, cycles, unbounded waits.
      - name: Static checks (lint, types, tags, architecture)
        run: |
          npm run lint
          npm run typecheck
          npm run check:tags
          npm run test:architecture

      - name: Install Chromium
        uses: ./.github/actions/install-browsers
        with:
          browsers: chromium

      - uses: ./.github/actions/toolshop-ready

      # Suite "pr" (src/tags.ts): smoke + accessibility + visual on API and Chromium.
      - name: Run PR suite (API + Chromium)
        run: npm run test:pr

      - name: Dump Toolshop logs on failure
        if: ${{ failure() }}
        working-directory: toolshop
        run: docker compose logs --tail=200

      - name: Upload HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload results for the summary
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: ts-results
          path: reports/ts-results.json
          retention-days: 14

  smoke-java:
    name: smoke (Java)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/toolshop-start

      - uses: ./.github/actions/setup-java-suite

      - uses: ./.github/actions/toolshop-ready

      - name: Run smoke tests (JUnit 5)
        working-directory: java
        run: ./mvnw -B test -Dgroups=smoke

      - name: Dump Toolshop logs on failure
        if: ${{ failure() }}
        working-directory: toolshop
        run: docker compose logs --tail=200

      - name: Upload JUnit reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: junit-reports
          path: java/target/surefire-reports/
          retention-days: 14

      # Traces exist only for failed attempts (RETAIN_ON_FAILURE), including those of a flaky test, whose job is green.
      - name: Upload Java traces of failed attempts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: junit-reports-traces
          path: java/target/playwright/
          if-no-files-found: ignore
          retention-days: 14

  # Shows the run as a diagram and compares TypeScript and Java per test ID (job summary on the run page).
  summary:
    name: pipeline summary
    if: ${{ !cancelled() }}
    needs: [smoke, smoke-java]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      statuses: write # the verdict as a commit status
    steps:
      - uses: actions/checkout@v7

      - name: Download TypeScript results
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: ts-results
          path: results/ts

      - name: Download Java results
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: junit-reports
          path: results/java

      - name: Write pipeline summary
        id: summary
        env:
          TS_JOB: ${{ needs.smoke.result }}
          JAVA_JOB: ${{ needs.smoke-java.result }}
        run: node scripts/pipeline-summary.mjs results/ts/ts-results.json results/java

      # Green check for Passed and for Passed with flaky (the description names the flaky tests), red cross for Failed.
      # Shown next to the commit and in the PR checks: the Actions run list itself only has the run's own icon.
      - name: Report the verdict on the commit
        if: ${{ steps.summary.outputs.state != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          STATE: ${{ steps.summary.outputs.state }}
          DESCRIPTION: ${{ steps.summary.outputs.description }}
        run: >-
          gh api "repos/$GITHUB_REPOSITORY/statuses/$SHA"
          -f state="$STATE" -f description="$DESCRIPTION" -f context="test verdict / PR smoke"
          -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
