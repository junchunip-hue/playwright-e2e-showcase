name: Update Visual Baselines

# Add the `update-snapshots` label to a PR to (re)generate the Linux baselines for @visual tests
# against the pinned Toolshop and commit them to the PR branch. The label is removed afterwards.
# Review the committed PNGs in the PR diff like any other change.
on:
  pull_request:
    types: [labeled]

concurrency:
  group: visual-baselines-${{ github.head_ref }}
  cancel-in-progress: true

# Same Toolshop version as the PR gate (.github/actions/toolshop-start), so baselines always match it.
jobs:
  update:
    # Same-repo PRs only: a fork's token cannot push to its branch.
    if: ${{ github.event.label.name == 'update-snapshots' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}

      - name: Start Toolshop
        uses: ./.github/actions/toolshop-start

      - name: Set up Node, dependencies and browsers
        uses: ./.github/actions/setup-node-suite
        with:
          browsers: chromium

      - name: Wait for Toolshop and start its background jobs
        uses: ./.github/actions/toolshop-ready

      # Suite "visual" (src/tags.ts).
      - name: Regenerate baselines
        run: npm run test:visual -- --update-snapshots=all

      # Proves the new baselines are stable before they are committed.
      - name: Verify baselines against a second run
        run: npm run test:visual

      - name: Commit baselines to the PR branch
        id: commit
        run: |
          git add 'tests/**/*-linux.png'
          if git diff --cached --quiet; then
            echo "Baselines unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update visual baselines (Linux, Chromium)"
          git push
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      # GitHub starts no workflow for a push made with GITHUB_TOKEN, so the commit above gets no PR checks. The main
      # ruleset requires them, so the PR cannot merge until they run; say how to get them.
      - name: Tell the PR how to get checks on the new commit
        if: ${{ steps.commit.outputs.sha != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.commit.outputs.sha }}
        run: >-
          gh pr comment ${{ github.event.pull_request.number }} --repo ${{ github.repository }}
          --body "Visual baselines committed as $SHA. GitHub runs no workflow on a commit pushed by Actions, so
          this commit has no PR checks yet, and the required checks block the merge without them. Review the PNGs,
          then push any commit to the branch (for example \`git commit --allow-empty -m 'Run PR checks' && git push\`)
          to run them."

      - name: Remove the label
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr edit ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --remove-label update-snapshots

      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: visual-baselines-report
          path: playwright-report/
          retention-days: 7
