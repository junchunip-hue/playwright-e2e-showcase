name: Nightly Regression

on:
  schedule:
    - cron: '0 2 * * *' # 02:00 UTC every night
  workflow_dispatch:
  # Runs once on PRs that change this workflow, so it is validated before merge.
  # The report is only published from master (see deploy-report).
  pull_request:
    paths:
      - .github/workflows/nightly-regression.yml

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

# Toolshop version and URLs come from .github/actions/toolshop-start (shared with the PR workflow).
env:
  SHARD_TOTAL: 3

jobs:
  # Full TypeScript suite (all tags) on Chromium, Firefox and WebKit, split across shards.
  # Every shard boots its own Toolshop, so shards never share data.
  regression:
    name: regression (shard ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7

      - name: Start Toolshop
        uses: ./.github/actions/toolshop-start

      - name: Set up Node, dependencies and browsers
        uses: ./.github/actions/setup-node-suite
        with:
          browsers: chromium firefox webkit

      - name: Wait for Toolshop and start its background jobs
        uses: ./.github/actions/toolshop-ready

      # Suite "nightly" (src/tags.ts): everything except the Test Agents' seed and the failure controls (step below).
      # blob output is merged into one HTML report by merge-reports.
      - name: Run regression shard
        env:
          SUITE: nightly
        # bddgen first: the Gherkin features become Playwright tests (playwright.config.ts).
        run: npx bddgen && npx playwright test --shard=${{ matrix.shard }}/${{ env.SHARD_TOTAL }} --reporter=./src/reporters/no-error-context.ts,blob,github

      - name: Dump Toolshop logs on failure
        if: ${{ failure() }}
        working-directory: toolshop
        run: docker compose logs --tail=200

      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report/
          retention-days: 1

      # The failure controls (features/control, ADR 0013) fail on purpose, so the merged report always shows what a
      # failure looks like: C1 an API failure (api project), C2 a UI failure with its screenshot (chromium). Shard 1 runs them once, after the regression run and with their own blob report (picked up by
      # merge-reports like the shards'); continue-on-error keeps the shard green, and the summary counts it nowhere.
      - name: Run the failure controls C1, C2 (fail on purpose, not counted)
        if: ${{ matrix.shard == 1 && !cancelled() }}
        continue-on-error: true
        env:
          SUITE: control
          PLAYWRIGHT_BLOB_OUTPUT_DIR: blob-report-control
        # --no-deps: C2 is @logged-out, so the chromium project's sign-in setup is not needed; run here it would be counted
        # as one more TypeScript test (nightly #94 showed 152 instead of 151).
        # Traces: SUITE=control keeps the trace of a failed browser test (playwright.config.ts), so C2 has its trace as
        # in Java; the api project records none (C1), as in Java.
        run: >-
          npx bddgen && npx playwright test --project=api --project=chromium --no-deps --retries=0
          --reporter=./src/reporters/no-error-context.ts,blob

      - name: Upload the failure controls' blob report
        if: ${{ matrix.shard == 1 && !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: blob-report-control
          path: blob-report-control/
          if-no-files-found: ignore
          retention-days: 1

  merge-reports:
    name: merge reports
    if: ${{ !cancelled() }}
    needs: [regression]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node and dependencies
        uses: ./.github/actions/setup-node-suite

      # Artifact storage occasionally fails one download even after the action's own retries (the blob was fine
      # minutes later), which would turn a green run red. One more attempt after a pause rides that out.
      - name: Download blob reports
        id: download-blobs
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true

      - name: Wait before retrying the download
        if: ${{ steps.download-blobs.outcome == 'failure' }}
        run: sleep 60

      - name: Download blob reports (retry)
        if: ${{ steps.download-blobs.outcome == 'failure' }}
        uses: actions/download-artifact@v8
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true

      # JSON next to HTML feeds the pipeline summary.
      - name: Merge into one HTML report
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: reports/ts-results.json
          PLAYWRIGHT_HTML_TITLE: 'TypeScript (Playwright Test) · nightly run #${{ github.run_number }}'
        run: npx playwright merge-reports --reporter html,json ./all-blob-reports

      # A click on a screenshot (e.g. a failed step's) opens it enlarged, with a download button (scripts/report-lightbox.mjs).
      # The site's navigation bar on top: back one level (results page, list, test) or up to the README (site-nav.mjs).
      - name: Add the screenshot viewer and the navigation to the report
        run: |
          node scripts/report-lightbox.mjs playwright-report
          node scripts/site-nav.mjs playwright-report "TypeScript report"

      - name: Upload results for the summary
        uses: actions/upload-artifact@v7
        with:
          name: ts-results
          path: reports/ts-results.json
          retention-days: 30

      - name: Upload HTML report
        uses: actions/upload-artifact@v7
        with:
          name: regression-report
          path: playwright-report/
          retention-days: 30

  # Publishes the nightly's site at the repository's GitHub Pages URL: a landing page for both languages, the merged
  # TypeScript report (typescript/), the Java results (java/) and the README badges. The site is put
  # together by the summary job, which has both languages' results. Requires Settings → Pages → Source: "GitHub Actions".
  deploy-report:
    name: publish report
    if: ${{ !cancelled() && github.event_name != 'pull_request' && github.ref == 'refs/heads/master' && needs.summary.result == 'success' }}
    needs: [summary]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5

  # Full Java suite (all tags, not just smoke) against its own Toolshop.
  regression-java:
    name: regression (Java)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Start Toolshop
        uses: ./.github/actions/toolshop-start

      - name: Set up JDK, compiled tests and Chromium
        uses: ./.github/actions/setup-java-suite

      - name: Wait for Toolshop and start its background jobs
        uses: ./.github/actions/toolshop-ready

      # Every feature except the failure controls C1, C2 (pom.xml excludedGroups), which run in their own step below.
      - name: Run all Java tests
        working-directory: java
        run: ./mvnw -B test

      - name: Dump Toolshop logs on failure
        if: ${{ failure() }}
        working-directory: toolshop
        run: docker compose logs --tail=200

      - name: Upload JUnit reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: junit-reports-nightly
          path: java/target/surefire-reports/
          retention-days: 30

      # The failure controls C1, C2 (see the TypeScript shard): excluded from every ordinary Maven run (pom.xml
      # excludedGroups), run here on its own, without reruns, into its own reports and scenario log.
      - name: Run the failure controls C1, C2 (fail on purpose, not counted)
        if: ${{ !cancelled() }}
        continue-on-error: true
        working-directory: java
        run: >-
          ./mvnw -B test -Dgroups=control -DexcludedGroups= -Dsurefire.rerunFailingTestsCount=0
          -Dsurefire.reportsDirectory=target/control-reports -Dscenario.log=target/control-reports/scenarios.jsonl

      - name: Upload the failure controls' JUnit reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: junit-reports-control
          path: java/target/control-reports/
          if-no-files-found: ignore
          retention-days: 30

      # Traces exist only for failed attempts (RETAIN_ON_FAILURE), including those of a flaky test, whose job is green.
      - name: Upload Java traces of failed attempts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: junit-reports-nightly-traces
          path: java/target/playwright/
          if-no-files-found: ignore
          retention-days: 30

  # Diagram of the run and TypeScript-vs-Java results per test ID (job summary on the run page).
  summary:
    name: pipeline summary
    if: ${{ !cancelled() }}
    needs: [regression, merge-reports, regression-java]
    runs-on: ubuntu-latest
    timeout-minutes: 10 # includes npm ci for the planned-test list
    permissions:
      contents: read
      actions: read
      statuses: write # the verdict as a commit status
      checks: read # error annotations of failed jobs
    steps:
      - uses: actions/checkout@v7

      - name: Download TypeScript results
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: ts-results
          path: results/ts

      - name: Download Java results
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: junit-reports-nightly
          path: results/java

      - name: Download the Java failure controls' results
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: junit-reports-control
          path: results/java-control

      # Traces of failed Java attempts (the failure controls' included), attached to the Java report.
      - name: Download the Java traces
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: junit-reports-nightly-traces
          path: results/java-traces

      # The tests this run planned (same suite and projects as the test job, no browser needed), so a test that never
      # ran shows as "not run" instead of disappearing from the counts.
      # Only the planned-test list needs it: if npm fails, the summary still runs and says the list is missing.
      - name: Set up Node and dependencies
        continue-on-error: true
        uses: ./.github/actions/setup-node-suite

      - name: List the planned TypeScript tests
        continue-on-error: true
        env:
          SUITE: nightly
          BASE_URL: http://localhost:4200 # our own Toolshop, as in the test job (not the public demo)
          PLAYWRIGHT_JSON_OUTPUT_FILE: results/ts-planned.json
        run: npx bddgen && npx playwright test --list --reporter=json

      # Which job and step failed, and the error it reported, so the summary can name it before anything else.
      - name: Collect failed jobs
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p results/jobs
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100" > results/jobs/jobs.json
          for id in $(jq -r '.jobs[] | select(.conclusion == "failure" or .conclusion == "timed_out" or .conclusion == "cancelled") | .id' results/jobs/jobs.json); do
            gh api "repos/$GITHUB_REPOSITORY/check-runs/$id/annotations" > "results/jobs/annotations-$id.json"
          done
          # A rerun ("Re-run failed jobs") must not pass for a clean first run: keep each earlier attempt's jobs, so the
          # summary can say that attempt N passed after attempt M failed.
          for attempt in $(seq 1 $((GITHUB_RUN_ATTEMPT - 1))); do
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$attempt/jobs?per_page=100" > "results/jobs/attempt-$attempt.json"
          done

      - name: Write pipeline summary
        id: summary
        env:
          PIPELINE: nightly
          BADGE_FILE: badge.json
          SUMMARY_JSON: summary.json # the same result as data, for the Pages landing page
          # A failed shard fails the TypeScript lane even though merge-reports succeeds without it: the missing
          # shard's tests are simply absent from the merged report (nightly 2026-11-19, apt mirrors unreachable).
          TS_JOB: ${{ needs.regression.result != 'success' && needs.regression.result || needs.merge-reports.result }}
          JAVA_JOB: ${{ needs.regression-java.result }}
          CONTROL_JAVA_DIR: results/java-control # the failure controls C1, C2: shown apart, never counted
        run: node scripts/pipeline-summary.mjs results/ts/ts-results.json results/java results/jobs results/ts-planned.json

      # Green check for Passed and for Passed with flaky (the description names the flaky tests), red cross for Failed.
      # Shown next to the commit and in the PR checks: the Actions run list itself only has the run's own icon.
      - name: Report the verdict on the commit
        if: ${{ steps.summary.outputs.state != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          STATE: ${{ steps.summary.outputs.state }}
          DESCRIPTION: ${{ steps.summary.outputs.description }}
        run: >-
          gh api "repos/$GITHUB_REPOSITORY/statuses/$SHA"
          -f state="$STATE" -f description="$DESCRIPTION" -f context="test verdict / nightly"
          -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      # GitHub Pages: a landing page for both languages (built below), the merged TypeScript report under typescript/,
      # the Java results under java/, and badge.json for the README badge (shields.io endpoint).
      - name: Download HTML report for GitHub Pages
        if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/master' }}
        uses: actions/download-artifact@v8
        with:
          name: regression-report
          path: site/typescript

      - name: Add the badge to the site
        if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/master' }}
        run: cp badge.json site/badge.json

      # history.json and streak.json ("clean nightlies in a row", roadmap §5) live on Pages: read the last ones back,
      # add this run. Before the first publish, scripts/nightly-history-seed.json holds the earlier runs.
      - name: Update the nightly history
        if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/master' }}
        continue-on-error: true
        env:
          VERDICT: ${{ steps.summary.outputs.verdict }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ID: ${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: |
          curl -fsSL "https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/history.json" -o previous-history.json             || echo "No published history yet: starting from the seed"
          node scripts/nightly-history.mjs previous-history.json scripts/nightly-history-seed.json site

      # index.html: verdict, both lanes, the failure controls, TS vs Java per ID, flaky, failed tests with their steps,
      # history.
      - name: Build the landing page
        if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/master' }}
        continue-on-error: true # without it the reports and badges still publish
        run: node scripts/pages-site.mjs summary.json site

      # The Java results as a Playwright HTML report, in the same format as the TypeScript one: the scenario logs (with
      # every attempt, step, hook and error) become a blob report that the standard HTML reporter renders
      # (scripts/java-report.mjs). Built on every run (artifact java-report), published to /java/ from master.
      - name: Build the Java report
        id: java-report
        continue-on-error: true
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: java-report
          PLAYWRIGHT_HTML_OPEN: never
          PLAYWRIGHT_HTML_TITLE: 'Java (Cucumber-JVM) · nightly run #${{ github.run_number }}'
        run: |
          node scripts/java-report.mjs java-blob results/java results/java-control --traces results/java-traces
          npx playwright merge-reports --reporter html java-blob
          node scripts/report-lightbox.mjs java-report
          node scripts/site-nav.mjs java-report "Java report"

      - name: Upload the Java report
        if: ${{ steps.java-report.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: java-report
          path: java-report/
          retention-days: 14

      - name: Add the Java report to the site
        if: ${{ steps.java-report.outcome == 'success' && github.event_name != 'pull_request' && github.ref == 'refs/heads/master' }}
        run: cp -r java-report site/java

      - name: Upload GitHub Pages artifact
        if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/master' }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/
