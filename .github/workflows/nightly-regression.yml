name: Nightly Regression

on:
  schedule:
    - cron: '0 2 * * *' # 02:00 UTC every night
  workflow_dispatch:
  # Runs once on PRs that change this workflow, so it is validated before merge.
  # The report is only published from main (see deploy-report).
  pull_request:
    paths:
      - .github/workflows/nightly-regression.yml

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

env:
  TOOLSHOP_REF: ae7caecb811dd8952c09d997e69be7cb946ecd44
  SPRINT: sprint5
  DISABLE_LOGGING: 'true'
  BASE_URL: http://localhost:4200
  API_URL: http://localhost:8091
  SHARD_TOTAL: 3

jobs:
  # Full TypeScript suite (all tags) on Chromium, Firefox and WebKit, split across shards.
  # Every shard boots its own Toolshop, so shards never share data.
  regression:
    name: regression (shard ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/toolshop-start
        with:
          ref: ${{ env.TOOLSHOP_REF }}
          sprint: ${{ env.SPRINT }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - uses: ./.github/actions/toolshop-ready
        with:
          api-url: ${{ env.API_URL }}
          base-url: ${{ env.BASE_URL }}

      # blob output is merged into one HTML report by merge-reports.
      - name: Run regression shard
        run: npx playwright test --shard=${{ matrix.shard }}/${{ env.SHARD_TOTAL }} --reporter=blob,github

      - name: Dump Toolshop logs on failure
        if: ${{ failure() }}
        working-directory: toolshop
        run: docker compose logs --tail=200

      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report/
          retention-days: 1

  merge-reports:
    name: merge reports
    if: ${{ !cancelled() }}
    needs: [regression]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download blob reports
        uses: actions/download-artifact@v8
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true

      - name: Merge into one HTML report
        run: npx playwright merge-reports --reporter html ./all-blob-reports

      - name: Upload HTML report
        uses: actions/upload-artifact@v7
        with:
          name: regression-report
          path: playwright-report/
          retention-days: 30

      - name: Upload report for GitHub Pages
        if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: playwright-report/

  # Publishes the latest merged report at the repository's GitHub Pages URL.
  # Requires Settings → Pages → Source: "GitHub Actions".
  deploy-report:
    name: publish report
    if: ${{ !cancelled() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.merge-reports.result == 'success' }}
    needs: [merge-reports]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5

  # Full Java suite (all tags, not just smoke) against its own Toolshop.
  regression-java:
    name: regression (Java)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/toolshop-start
        with:
          ref: ${{ env.TOOLSHOP_REF }}
          sprint: ${{ env.SPRINT }}

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: java/pom.xml

      - name: Compile tests
        working-directory: java
        run: ./mvnw -B -q test-compile

      - name: Install Chromium
        working-directory: java
        run: ./mvnw -B -q exec:java -Dexec.args="install --with-deps chromium"

      - uses: ./.github/actions/toolshop-ready
        with:
          api-url: ${{ env.API_URL }}
          base-url: ${{ env.BASE_URL }}

      - name: Run all Java tests
        working-directory: java
        run: ./mvnw -B test

      - name: Dump Toolshop logs on failure
        if: ${{ failure() }}
        working-directory: toolshop
        run: docker compose logs --tail=200

      - name: Upload JUnit reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: junit-reports-nightly
          path: java/target/surefire-reports/
          retention-days: 30
