name: Set up Java suite
description: JDK, compiled tests and Chromium (with OS dependencies) for the Java + JUnit 5 suite in java/.

runs:
  using: composite
  steps:
    - uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: '21'
        cache: maven
        cache-dependency-path: java/pom.xml

    - name: Compile tests
      shell: bash
      working-directory: java
      run: ./mvnw -B -q test-compile

    - name: Install Chromium
      shell: bash
      working-directory: java
      run: ./mvnw -B -q exec:java -Dexec.args="install --with-deps chromium"
