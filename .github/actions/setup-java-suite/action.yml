name: Set up Java suite
description: JDK, compiled tests and Chromium (with OS dependencies) for the Java suite in java/ (Cucumber-JVM on JUnit 5).

runs:
  using: composite
  steps:
    - uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: '21'
        cache: maven
        cache-dependency-path: java/pom.xml

    # In CI every Maven build runs spotless:check first (java/pom.xml, profile ci-retries): unformatted Java fails here.
    - name: Check code style and compile tests
      shell: bash
      working-directory: java
      run: ./mvnw -B -q test-compile

    # Same bounded, cached install as the TypeScript suite, through the Java CLI (its own Playwright version).
    - name: Install Chromium
      uses: ./.github/actions/install-browsers
      with:
        browsers: chromium
        java-dir: java
