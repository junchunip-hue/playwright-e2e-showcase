name: Wait for Toolshop
description: >
  Installs API dependencies, seeds the database and waits until the API and UI both serve data.
  Uses BASE_URL and API_URL exported by toolshop-start.

runs:
  using: composite
  steps:
    - name: Install API dependencies
      shell: bash
      working-directory: toolshop
      run: docker compose exec -T -u root laravel-api composer install --no-dev --optimize-autoloader --ignore-platform-req=ext-ffi

    - name: Wait for database
      shell: bash
      working-directory: toolshop
      run: |
        for i in $(seq 1 30); do
          docker compose exec -T mariadb mysqladmin ping -h localhost -u root -proot --silent && exit 0
          echo "MariaDB not ready ($i/30)"; sleep 2
        done
        exit 1

    - name: Create & seed database
      shell: bash
      working-directory: toolshop
      run: docker compose exec -T laravel-api php artisan migrate:refresh --seed

    # In production Toolshop's scheduler writes invoice PDFs and works off queued jobs (stock updates, emails) every
    # minute. Nothing runs them in a plain `docker compose up`, so a PDF would never be ready (S5 downloads one).
    # This runs the same two commands every 10 seconds for at most an hour (the job ends long before).
    # `order:update` is left out on purpose: it moves order statuses by itself and would race S3 and A11.
    - name: Run background jobs (invoice PDFs, queue)
      shell: bash
      working-directory: toolshop
      run: >-
        docker compose exec -d -T laravel-api sh -c
        'for i in $(seq 1 360); do php artisan invoice:generate > /dev/null 2>&1;
        php artisan queue:work --stop-when-empty > /dev/null 2>&1; sleep 10; done'

    # Probe a data endpoint, not just /status: /status was green while /products returned 500.
    - name: Wait for API and UI
      shell: bash
      run: |
        for i in $(seq 1 60); do
          api=$(curl -s -o /dev/null -w '%{http_code}' "$API_URL/products" || true)
          ui=$(curl -s -o /dev/null -w '%{http_code}' "$BASE_URL" || true)
          [ "$api" = "200" ] && [ "$ui" = "200" ] && echo "Toolshop is up" && exit 0
          echo "API=$api UI=$ui ($i/60)"; sleep 10
        done
        echo "::error::Toolshop did not become healthy"
        curl -s "$API_URL/products" | head -c 2000
        exit 1
