name: Set up TypeScript suite
description: >
  Node toolchain and dependencies for the TypeScript suite, plus optional Playwright browsers.
  Leave `browsers` empty to install them in a later step (e.g. after lint, so static checks fail fast).

inputs:
  browsers:
    description: Space-separated Playwright browsers to install with OS dependencies (empty = none)
    default: ''

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: 22
        cache: npm

    - name: Install dependencies
      shell: bash
      run: npm ci

    - name: Install browsers
      if: ${{ inputs.browsers != '' }}
      uses: ./.github/actions/install-browsers
      with:
        browsers: ${{ inputs.browsers }}
